name: CodeBounties 19106 exception-boundary verification

on:
  push:
    branches: ['verify/19106-exception-boundary-20260926']
    paths: ['.github/workflows/codebounties-19106-once.yml']

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Ariyachan/omi'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: false
      - name: Install the unchanged project dependency lock
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python
          mkdir -p /tmp/omi-19106-proof
          git rev-parse HEAD > /tmp/omi-19106-proof/revision.txt
          .venv/bin/python --version > /tmp/omi-19106-proof/python.txt
          .venv/bin/python -c "import importlib.metadata as m,json; print(json.dumps({n:m.version(n) for n in ['pytest','google-api-core','google-cloud-firestore']}))" > /tmp/omi-19106-proof/versions.json
      - name: Prepare the narrowly scoped source and regression changes
        working-directory: backend
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          source_path = Path('database/wrapped.py')
          test_path = Path('tests/unit/test_database_wrapped_resilience.py')
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob_sha(source_path.read_bytes()) == '29075a0d735d19c246b17875d94f205d42950cda'
          assert blob_sha(test_path.read_bytes()) == 'a96e1fb78540ea521a51bb02d7de52fe8e24763a'
          source = source_path.read_text()
          assert source.count('except Exception as e:') == 2
          source = source.replace('from ._client import db', 'from google.api_core.exceptions import GoogleAPIError\n\nfrom ._client import db')
          source = source.replace('except Exception as e:', 'except GoogleAPIError as e:')
          source_path.write_text(source)
          tests = test_path.read_text()
          assert tests.count('Exception("NotFound: document deleted concurrently")') == 1
          assert tests.count('Exception("Firestore write error")') == 1
          tests = tests.replace('import pytest\n', 'import pytest\nfrom google.api_core.exceptions import NotFound, ServiceUnavailable\n')
          tests = tests.replace('Exception("NotFound: document deleted concurrently")', 'NotFound("document deleted concurrently")')
          tests = tests.replace('Exception("Firestore write error")', 'NotFound("document deleted concurrently")')
          tests += '''

          @pytest.mark.parametrize("operation", ["status", "progress"])
          @pytest.mark.parametrize("error_type", [NotFound, ServiceUnavailable])
          def test_wrapped_updates_keep_api_failures_fail_soft(monkeypatch, operation, error_type):
              fake_db = MagicMock()
              ref = fake_db.collection.return_value.document.return_value.collection.return_value.document.return_value
              ref.get.return_value.exists = True
              ref.update.side_effect = error_type("synthetic provider failure")
              monkeypatch.setattr(wrapped_db, "db", fake_db)

              if operation == "status":
                  result = wrapped_db.update_wrapped_status("user-123", 2025, WrappedStatus.DONE)
              else:
                  result = wrapped_db.update_wrapped_progress("user-123", 2025, {"pct": 0.5})

              assert result is False
              ref.update.assert_called_once()
              ref.set.assert_not_called()


          @pytest.mark.parametrize("operation", ["status", "progress"])
          @pytest.mark.parametrize("error_type", [RuntimeError, ValueError, TypeError])
          def test_wrapped_updates_preserve_unexpected_errors(monkeypatch, operation, error_type):
              fake_db = MagicMock()
              ref = fake_db.collection.return_value.document.return_value.collection.return_value.document.return_value
              ref.get.return_value.exists = True
              error = error_type("synthetic programming or serialization failure")
              ref.update.side_effect = error
              monkeypatch.setattr(wrapped_db, "db", fake_db)

              with pytest.raises(error_type) as raised:
                  if operation == "status":
                      wrapped_db.update_wrapped_status("user-123", 2025, WrappedStatus.DONE)
                  else:
                      wrapped_db.update_wrapped_progress("user-123", 2025, {"pct": 0.5})

              assert raised.value is error
              ref.update.assert_called_once()
              ref.set.assert_not_called()
          '''
          import textwrap
          marker = '\n\n          @pytest.mark.parametrize'
          start = tests.index(marker)
          tests = tests[:start] + '\n\n' + textwrap.dedent(tests[start:]).lstrip('\n')
          test_path.write_text(tests)
          compile(source, str(source_path), 'exec')
          compile(tests, str(test_path), 'exec')
          PY
      - name: Format only the two changed files
        working-directory: backend
        run: |
          uvx --from black==25.1.0 black --line-length 120 --skip-string-normalization database/wrapped.py tests/unit/test_database_wrapped_resilience.py
          uvx --from black==25.1.0 black --version > /tmp/omi-19106-proof/formatter.txt
          git diff --check
          git diff -- database/wrapped.py tests/unit/test_database_wrapped_resilience.py > /tmp/omi-19106-proof/change.patch
      - name: Verify the original code swallows the six unexpected-error cases
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          cp database/wrapped.py /tmp/omi-19106-proof/wrapped.py
          cp tests/unit/test_database_wrapped_resilience.py /tmp/omi-19106-proof/test_database_wrapped_resilience.py
          trap 'cp /tmp/omi-19106-proof/wrapped.py database/wrapped.py' EXIT
          git show HEAD:backend/database/wrapped.py > database/wrapped.py
          set +e
          .venv/bin/python -m pytest tests/unit/test_database_wrapped_resilience.py -q --junitxml=/tmp/omi-19106-proof/baseline.xml > /tmp/omi-19106-proof/baseline.log 2>&1
          result=$?
          set -e
          echo "$result" > /tmp/omi-19106-proof/baseline.exit
          cat /tmp/omi-19106-proof/baseline.log
          test "$result" -eq 1
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('/tmp/omi-19106-proof/baseline.xml')
          cases = list(tree.iter('testcase'))
          failures = [c for c in cases if c.find('failure') is not None]
          assert len(cases) == 25 and len(failures) == 6
          assert not list(tree.iter('error')) and not list(tree.iter('skipped'))
          assert all(c.get('name', '').startswith('test_wrapped_updates_preserve_unexpected_errors') for c in failures)
          assert all('DID NOT RAISE' in (c.find('failure').text or '') for c in failures)
          print('Negative control confirmed: only the six unexpected-error propagation cases fail.')
          PY
      - name: Run the fixed focused suite
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest tests/unit/test_database_wrapped_resilience.py -q --junitxml=/tmp/omi-19106-proof/current.xml | tee /tmp/omi-19106-proof/current.log
          .venv/bin/python -m py_compile database/wrapped.py tests/unit/test_database_wrapped_resilience.py
          uvx --from black==25.1.0 black --check --line-length 120 --skip-string-normalization database/wrapped.py tests/unit/test_database_wrapped_resilience.py
          git diff --check
          git diff --exit-code -- pylock.toml
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          import xml.etree.ElementTree as ET
          root = Path('/tmp/omi-19106-proof')
          tree = ET.parse(root / 'current.xml')
          cases = list(tree.iter('testcase'))
          assert len(cases) == 25
          assert not list(tree.iter('failure')) and not list(tree.iter('error')) and not list(tree.iter('skipped'))
          expected = {'backend/database/wrapped.py', 'backend/tests/unit/test_database_wrapped_resilience.py'}
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == expected, changed
          summary = {'base_head':'55859ac296dc8b43258cb8b0d56b0fcc17dfcc7e', 'tests':25, 'passed':25, 'failures':0, 'errors':0, 'skipped':0, 'negative_control':{'tests':25,'passed':19,'expected_failures':6,'errors':0,'skipped':0}, 'files':{}}
          for repo_path, saved_name in [('database/wrapped.py','wrapped.py'), ('tests/unit/test_database_wrapped_resilience.py','test_database_wrapped_resilience.py')]:
              data = Path(repo_path).read_bytes()
              assert data == (root / saved_name).read_bytes()
              summary['files']['backend/' + repo_path] = {'artifact_name':saved_name, 'sha256':hashlib.sha256(data).hexdigest(), 'blob_sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()}
          summary['scope'] = 'Focused database unit tests using the real locked Google API exception classes and a mocked database boundary. No live services, complete backend suite, emulator, full preflight, or upstream CI success asserted.'
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Preserve exact tested source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omi-19106-exception-proof
          path: /tmp/omi-19106-proof
          retention-days: 2
          if-no-files-found: ignore
