name: CodeBounties 18945 one-off fixture verification

on:
  push:
    branches: ['verify/18945-fixture-isolation-20260926']
    paths: ['.github/workflows/codebounties-18945-once.yml']

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Ariyachan/omi'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@ecd24dd710f2fb0dca1693a67af11fc4a5c5ec84
        with:
          enable-cache: false
      - name: Install the unchanged project lock
        working-directory: backend
        run: |
          uv venv .venv
          uv pip sync pylock.toml --python .venv/bin/python
          mkdir -p /tmp/omi-18945-proof
          git rev-parse HEAD > /tmp/omi-18945-proof/revision.txt
          .venv/bin/python --version > /tmp/omi-18945-proof/python.txt
          .venv/bin/python -c "import importlib.metadata as m,json; print(json.dumps({n:m.version(n) for n in ['pytest','prometheus-client','google-cloud-firestore']}))" > /tmp/omi-18945-proof/versions.json
      - name: Record the unmodified combined-process result
        working-directory: backend
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest tests/unit/test_users_settings_null_defaults.py tests/unit/test_users_missing_doc_guards.py tests/unit/test_firestore_cache.py -q --junitxml=/tmp/omi-18945-proof/baseline.xml > /tmp/omi-18945-proof/baseline.log 2>&1
          result=$?
          echo "$result" > /tmp/omi-18945-proof/baseline.exit
          cat /tmp/omi-18945-proof/baseline.log
          exit 0
      - name: Isolate the unrelated account-deletion import in the new fixture
        working-directory: backend
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/unit/test_users_settings_null_defaults.py')
          source = p.read_text()
          anchor = '        "database.firestore_cache": _module(\n'
          assert source.count(anchor) == 1
          insertion = '''        # These settings tests never invoke account-deletion behavior. Keep its
                  # metrics-registering import out of the restoring module sandbox.
                  "database.account_deletion_marker": _module(
                      "database.account_deletion_marker",
                      account_deletion_collection=MagicMock(),
                      account_deletion_document=MagicMock(),
                      account_deletion_firestore_client=MagicMock(),
                      get_user_deletion_wipe_status=MagicMock(),
                  ),
          '''
          p.write_text(source.replace(anchor, insertion + anchor))
          target = Path('/tmp/omi-18945-proof') / p.name
          target.write_bytes(p.read_bytes())
          (target.parent / 'test.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest() + '\n')
          compile(p.read_text(), str(p), 'exec')
          PY
          git diff --check
          git diff -- tests/unit/test_users_settings_null_defaults.py > /tmp/omi-18945-proof/fixture.patch
      - name: Run the combined files in the reported order
        working-directory: backend
        run: |
          .venv/bin/python -m pytest tests/unit/test_users_settings_null_defaults.py tests/unit/test_users_missing_doc_guards.py tests/unit/test_firestore_cache.py -q --junitxml=/tmp/omi-18945-proof/current.xml
      - name: Run the combined files in the reverse order
        working-directory: backend
        run: |
          .venv/bin/python -m pytest tests/unit/test_firestore_cache.py tests/unit/test_users_missing_doc_guards.py tests/unit/test_users_settings_null_defaults.py -q --junitxml=/tmp/omi-18945-proof/reverse.xml
      - name: Verify the observed regression and both complete focused runs
        working-directory: backend
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          root = Path('/tmp/omi-18945-proof')
          baseline = ET.parse(root / 'baseline.xml')
          errors = list(baseline.iter('error')) + list(baseline.iter('failure'))
          matching = [e for e in errors if 'Duplicated timeseries' in ((e.text or '') + e.get('message', ''))]
          assert (root / 'baseline.exit').read_text().strip() != '0', 'Reported baseline failure did not reproduce'
          assert matching, 'Baseline did not fail with the reported metric-registration problem'
          results = {}
          for name in ['current', 'reverse']:
              tree = ET.parse(root / (name + '.xml'))
              cases = list(tree.iter('testcase'))
              assert cases and not list(tree.iter('failure')) and not list(tree.iter('error')) and not list(tree.iter('skipped'))
              settings = [c for c in cases if 'test_users_settings_null_defaults' in c.get('classname', '')]
              assert len(settings) == 8, (name, len(settings))
              results[name] = {'tests':len(cases), 'settings_cases':len(settings), 'failures':0, 'errors':0, 'skipped':0}
          results['baseline_duplicate_metric_errors'] = len(matching)
          results['scope'] = 'Three existing unit-test files in two orders; not the complete backend suite or upstream CI.'
          (root / 'summary.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps(results, indent=2))
          PY
      - name: Confirm only the intended fixture changed
        run: |
          test "$(git diff --name-only)" = 'backend/tests/unit/test_users_settings_null_defaults.py'
          git diff --exit-code -- backend/database backend/models backend/pylock.toml
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omi-18945-fixture-proof
          path: /tmp/omi-18945-proof
          retention-days: 2
          if-no-files-found: ignore
